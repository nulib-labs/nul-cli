[build-system]
requires = ["setuptools>=84.2.1", "wheel>=0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nul-cli"
version = "0.1.1"
description = "Northwestern University CLI"
readme = "README.md"
authors = [{ name = "Brendan Quinn", email = "brendan-quinn@northwestern.edu" }]
requires-python = ">=3.14"
dependencies = [
  "rich>=15.0.0",
  "typer>=0.29.1",
  "tqdm>=4.70.1",
]

[project.urls]
Homepage = "https://github.com/nulib/nul-cli"
Repository = "https://github.com/nulib/nul-cli.git"
Issues = "https://github.com/nulib/nul-cli/issues"

[project.scripts]
nul = "nul_cli.main:run"

[tool.setuptools]
packages = ["nul_cli"]

[dependency-groups]
dev = [
    "build>=1.6.1",
    "pytest>=9.2.0",
    "twine>=7.0.0",
]
