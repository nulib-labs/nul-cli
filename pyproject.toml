[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nul-cli"
version = "0.1.0a1"
description = "Northwestern University CLI"
readme = "README.md"
authors = [{ name = "Brendan Quinn", email = "brendan-quinn@northwestern.edu" }]
requires-python = ">=3.10"
dependencies = [
  "rich>=13.9.4",
  "typer",
  "tqdm>=4.66.0",
  "typing-extensions>=4.1.0",
]

[project.urls]
Homepage = "https://github.com/nulib/nul-cli"
Repository = "https://github.com/nulib/nul-cli.git"
Issues = "https://github.com/nulib/nul-cli/issues"

[project.scripts]
nul = "nul_cli.main:run"

[tool.setuptools]
packages = ["nul_cli"]

[dependency-groups]
dev = [
    "build>=1.3.0",
    "pytest>=9.0.3",
    "twine>=6.2.0",
]
